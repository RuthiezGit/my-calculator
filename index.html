<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Duplicate</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>CalcMe</h1>
        </header>

        <main>
            <section class="hero">
                <section class="calculator">
                    <div id="display">0</div>
                    <section class="controls">
                        <button class="history-btn"><span class="material-icons">history</span></button>
                        <button onclick="toggleChainMode()" id="chainBtn">CHAIN: OFF</button>
                    </section>

                    <button class="btn clear">AC</button>
                    <button class="btn delete">⌫</button>
                    <button class="btn operator">+/-</button>
                    <button class="btn operator">÷</button>

                    <button class="btn number">7</button>
                    <button class="btn number">8</button>
                    <button class="btn number">9</button>
                    <button class="btn operator">×</button>

                    <button class="btn number">4</button>
                    <button class="btn number">5</button>
                    <button class="btn number">6</button>
                    <button class="btn operator">-</button>

                    <button class="btn number">1</button>
                    <button class="btn number">2</button>
                    <button class="btn number">3</button>
                    <button class="btn operator">+</button>

                    <button class="btn number">%</button>
                    <button class="btn zero">0</button>
                    <button class="btn number">.</button>
                    <button class="btn equals">=</button>

                </section>


                <section class="history-wrapper">
                    <h2>Free Online Calculator</h2>
                    <section class="history-box">
                        <button class="history-header">
                            <span class="material-icons">history</span>
                            <h2>History</h2>
                        </button>

                        <ul id="history-box"></ul>
                    </section>
                </section>
                <script src="calMe.js"></script>
            </section>
        </main>

        <footer>
            <p>Copyright: @CalcMe</p>
        </footer>
    </body>
</html>
